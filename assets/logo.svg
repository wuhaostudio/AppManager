<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d76e"/>
      <stop offset="1" stop-color="#f0a500"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- app window -->
  <rect x="128" y="176" width="256" height="208" rx="20" fill="none" stroke="#4fd1c5" stroke-width="14"/>
  <line x1="128" y1="240" x2="384" y2="240" stroke="#4fd1c5" stroke-width="14"/>
  <circle cx="164" cy="208" r="12" fill="#4fd1c5"/>
  <circle cx="200" cy="208" r="12" fill="#4fd1c5"/>
  <circle cx="236" cy="208" r="12" fill="#4fd1c5"/>
  <!-- moon (silence) overlapping the window top-right -->
  <circle cx="340" cy="150" r="64" fill="url(#moon)"/>
  <circle cx="366" cy="132" r="56" fill="url(#bg)"/>
  <!-- zzz -->
  <g fill="#f5d76e" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="150" y="150" font-size="64">z</text>
    <text x="196" y="128" font-size="48">z</text>
    <text x="232" y="112" font-size="34">z</text>
  </g>
</svg>
